[project]
name = "gathering-agent"
version = "0.1.0"
description = "A small local-first prototype for a visual gathering-agent brain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0",
    "pyautogui>=0.9.54",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
